<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liderança 1000</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Liderança 1000">
  <link rel="icon" type="image/png" href="icone.png">
  <link rel="apple-touch-icon" href="icone.png">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #appFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      display: block;
      z-index: 1;
    }

    /* BANNER DESTACADO PARA SOLICITAR A AUTORIZAÇÃO DO ÍCONE */
    #pwaInstallBanner {
      position: fixed;
      bottom: 24px;
      left: 16px;
      right: 16px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
      border: 2.5px solid #1a73e8;
      padding: 12px 16px;
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(80px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .btn-autorizar-icone {
      background: #1a73e8;
      color: #ffffff;
      border: none;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgba(26,115,232,0.35);
    }

    .btn-autorizar-icone:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- BANNER DE 1 TOQUE: SOLICITA A AUTORIZAÇÃO NATIVA DO ANDROID -->
  <div id="pwaInstallBanner">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="icone.png" alt="Liderança 1000" style="width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.15);">
      <div>
        <div style="font-weight: 700; font-size: 13px; color: #111827;">Liderança 1000</div>
        <div style="font-size: 11px; color: #6b7280;">Colocar ícone na tela inicial</div>
      </div>
    </div>
    <button class="btn-autorizar-icone" onclick="acionarInstalacaoNativa()">+ Adicionar</button>
  </div>

  <!-- APLICATIVO EM TELA CHEIA -->
  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbzcTqLZpHzaLCSrrSxGQ9tZ9RqO7CZejE3jJ-7K53aAjDCbiHJ3FvDLzuP2BIVxwozC/exec" 
    allow="geolocation; camera; microphone; clipboard-read; clipboard-write;">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
      });
    }

    var deferredPrompt = null;

    // Captura o evento nativo do Android
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      var banner = document.getElementById('pwaInstallBanner');
      if (banner) banner.style.display = 'flex';
    });

    window.addEventListener('appinstalled', function() {
      var banner = document.getElementById('pwaInstallBanner');
      if (banner) banner.style.display = 'none';
      deferredPrompt = null;
    });

    // Dispara a janela nativa de autorização do Android
    function acionarInstalacaoNativa() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choiceResult) {
          if (choiceResult.outcome === 'accepted') {
            var banner = document.getElementById('pwaInstallBanner');
            if (banner) banner.style.display = 'none';
          }
          deferredPrompt = null;
        });
      } else {
        // Caso o Chrome já tenha o app registrado em segundo plano
        alert('Solicitação enviada ao sistema! Se a janela de confirmação não abriu, o ícone já foi criado na lista de aplicativos do seu celular.');
      }
    }
  </script>
</body>
</html>
