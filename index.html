<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liderança 1000</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Liderança 1000">
  <link rel="icon" type="image/png" href="icone.png">
  <link rel="apple-touch-icon" href="icone.png">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #appFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      display: block;
      z-index: 1;
    }
    
    /* MODAL VISUAL ELEGANTE QUANDO O CHROME NÃO DISPARA O PROMPT NATIVO */
    #modalGuiaInstalacao {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9999999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 22px 20px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .btn-entendi {
      background: #1a73e8;
      color: #ffffff;
      border: none;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 14px;
      margin-top: 14px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- MODAL DE FIXAÇÃO DO ÍCONE -->
  <div id="modalGuiaInstalacao" onclick="fecharModalGuia()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <img src="icone.png" alt="Liderança 1000" style="width: 56px; height: 56px; border-radius: 14px; margin-bottom: 12px;">
      <h3 style="margin: 0 0 8px 0; font-size: 17px; color: #111827; font-weight: 700;">Fixar Ícone no Celular</h3>
      <p style="font-size: 13px; color: #4b5563; line-height: 1.5; margin: 0 0 12px 0;">
        Toque nos <strong>3 pontinhos ⋮</strong> no canto superior direito do seu navegador e selecione:<br>
        <span style="display: inline-block; margin-top: 8px; background: #e8f0fe; color: #1a73e8; font-weight: 700; padding: 6px 12px; border-radius: 8px;">
          📲 "Adicionar à tela inicial"
        </span>
      </p>
      <button class="btn-entendi" onclick="fecharModalGuia()">Entendi</button>
    </div>
  </div>

  <!-- APLICATIVO NATIVO EM TELA CHEIA -->
  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbzcTqLZpHzaLCSrrSxGQ9tZ9RqO7CZejE3jJ-7K53aAjDCbiHJ3FvDLzuP2BIVxwozC/exec" 
    allow="geolocation; camera; microphone; clipboard-read; clipboard-write;">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
      });
    }

    var eventoInstalacao = null;

    // Captura o evento nativo do Android
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      eventoInstalacao = e;
    });

    // Ao clicar no botão do app
    window.addEventListener('message', function(event) {
      if (event.data && event.data.acao === 'instalar_pwa') {
        if (eventoInstalacao) {
          eventoInstalacao.prompt();
          eventoInstalacao.userChoice.then(function() {
            eventoInstalacao = null;
          });
        } else {
          // Se o navegador já instalou ou bloqueou o pop-up automático, exibe a orientação imediata
          document.getElementById('modalGuiaInstalacao').style.display = 'flex';
        }
      }
    });

    function fecharModalGuia() {
      document.getElementById('modalGuiaInstalacao').style.display = 'none';
    }
  </script>
</body>
</html>
