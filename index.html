<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liderança 1000</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a73e8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Liderança 1000">
  <link rel="icon" type="image/png" href="icone.png">
  <link rel="apple-touch-icon" href="icone.png">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #appFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      display: block;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- APLICATIVO NATIVO EM TELA CHEIA -->
  <iframe 
    id="appFrame" 
    src="https://script.google.com/macros/s/AKfycbzcTqLZpHzaLCSrrSxGQ9tZ9RqO7CZejE3jJ-7K53aAjDCbiHJ3FvDLzuP2BIVxwozC/exec" 
    allow="geolocation; camera; microphone; clipboard-read; clipboard-write;">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
      });
    }

    var eventoInstalacao = null;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      eventoInstalacao = e;
    });

    window.addEventListener('message', function(event) {
      if (event.data && event.data.acao === 'instalar_pwa') {
        if (eventoInstalacao) {
          eventoInstalacao.prompt();
          eventoInstalacao = null;
        } else {
          var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          if (isIos) {
            alert('No iPhone: toque no ícone de Compartilhar (no rodapé do Safari) e selecione "Adicionar à Tela de Início".');
          } else {
            alert('Para fixar o ícone na tela inicial:\n\n1. Toque nos 3 pontinhos ⋮ no topo direito do navegador.\n2. Selecione "Adicionar à tela inicial" ou "Instalar aplicativo".');
          }
        }
      }
    });
  </script>
</body>
</html>
